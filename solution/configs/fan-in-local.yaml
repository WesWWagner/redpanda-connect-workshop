# Local (plaintext) fan-in with the Redpanda Migrator — see ../../configs/fan-in.yaml
# for the annotated student version.
input:
  broker:
    inputs:
      - redpanda_migrator:
          seed_brokers: ["localhost:19092"]
          topics: ["fab.events"]
          consumer_group: "fan-in-test"
          start_offset: earliest

      - redpanda_migrator:
          seed_brokers: ["localhost:29092"]
          topics: ["fab.events"]
          consumer_group: "fan-in-test"
          start_offset: earliest

output:
  redpanda_migrator:
    seed_brokers: ["localhost:39092"]
    topic: "central.events"
    consumer_groups:
      enabled: false
