# Student workbench.
#
# The ONLY thing you install on your machine is Docker. Every workshop tool
# (rpk, redpanda-connect, psql) lives inside this one container.
#
#   cp .env.example .env          # then fill in the values from your instructor
#   docker compose build workbench   # one-time (a few minutes)
#   docker compose up -d workbench
#   docker compose exec workbench bash
#
# You are now inside /workshop with all tools on the PATH and your .env values
# already loaded as environment variables. Run every lab command from here.
services:
  workbench:
    build:
      context: ./docker
    image: rp-workshop-workbench:latest
    container_name: rp-workbench
    # Your credentials are loaded into the container's environment, so
    # $SITE_A_BROKER, $PG_HOST, etc. work in every shell you exec into.
    env_file:
      - .env
    # The workshop folder is mounted live — edit configs on your host, run
    # them in here. Nothing to rebuild when you change a YAML file.
    #
    # redpanda.license is also mounted at Connect's default license path, so
    # Lab 2's postgres_cdc (a Redpanda Enterprise feature) works out of the box
    # — no flags, no env vars. A short-lived trial license ships in this repo;
    # replace redpanda.license with your own when it expires.
    volumes:
      - ./:/workshop
      - ./redpanda.license:/etc/redpanda/redpanda.license:ro
    working_dir: /workshop
    # Keep the container alive so you can exec into it whenever you want.
    command: ["sleep", "infinity"]
    # Give `docker compose exec workbench bash` a proper interactive terminal.
    stdin_open: true
    tty: true
