# Fan-in pipeline (Lab 1). Two redpanda_migrator inputs — one per fab cluster —
# faithfully replicate records (key, headers, timestamp) into central via a
# redpanda_migrator output. Broker addresses come from the environment the
# workbench sets for you ($SITE_A_BROKER, etc.).
input:
  broker:
    inputs:
      - redpanda_migrator:
          seed_brokers: ["${SITE_A_BROKER}"]
          topics: ["fab.events"]
          consumer_group: "fan-in-${STUDENT_ID}"
          start_offset: earliest

      - redpanda_migrator:
          seed_brokers: ["${SITE_B_BROKER}"]
          topics: ["fab.events"]
          consumer_group: "fan-in-${STUDENT_ID}"
          start_offset: earliest

output:
  redpanda_migrator:
    seed_brokers: ["${CENTRAL_BROKER}"]
    topic: "central.events"
    consumer_groups:
      enabled: false
