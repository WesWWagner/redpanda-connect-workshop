# CDC pipeline (Lab 2). postgres_cdc streams the orders table into cdc.orders,
# enriched with _captured_at. Connection details come from the environment the
# workbench sets for you ($PG_HOST, $CENTRAL_BROKER, etc.).
input:
  postgres_cdc:
    dsn: "postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DB}?sslmode=disable"
    schema: public
    tables:
      - orders
    slot_name: "rpcn_cdc_${STUDENT_ID}"
    stream_snapshot: true

pipeline:
  processors:
    - mapping: |
        root = this
        root._captured_at = now()

output:
  kafka_franz:
    seed_brokers: ["${CENTRAL_BROKER}"]
    topic: "cdc.orders"
