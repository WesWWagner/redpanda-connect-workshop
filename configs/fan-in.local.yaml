# Fan-in for the LOCAL self-test stack (docker-compose.local.yaml).
# Same Redpanda Migrator setup as configs/fan-in.yaml, but plaintext (no TLS/
# SASL) and pointed at the in-network clusters. Broker addresses come from the
# environment the local workbench sets for you.
input:
  broker:
    inputs:
      - redpanda_migrator:
          seed_brokers: ["${SITE_A_BROKER}"]
          topics: ["fab.events"]
          consumer_group: "fan-in-${STUDENT_ID}"
          start_offset: earliest

      - redpanda_migrator:
          seed_brokers: ["${SITE_B_BROKER}"]
          topics: ["fab.events"]
          consumer_group: "fan-in-${STUDENT_ID}"
          start_offset: earliest

output:
  redpanda_migrator:
    seed_brokers: ["${CENTRAL_BROKER}"]
    topic: "central.events"
    consumer_groups:
      enabled: false
